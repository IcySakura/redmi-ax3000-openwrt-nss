# 256 MiB board running NSS: OpenWrt reserves 16 MiB (vm.min_free_kbytes) on any
# board with more than 128 MiB; the stock Xiaomi firmware uses 2 MiB. 8 MiB keeps
# headroom for atomic RX refills and was measured under full Wi-Fi load with no
# allocation failures, leaving ~20 MiB more MemAvailable.
vm.min_free_kbytes=8192
